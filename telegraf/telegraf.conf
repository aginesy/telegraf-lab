# --- Global Tags ---
# Automatically appended to all collected metrics
[global_tags]
  lab = "telegraf-lab"

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false

# --- Processors ---
# Demonstrates Telegraf edge transformation: enriches metrics with a collector tag before Prometheus scraping
[[processors.override]]
  namepass = ["app_http_*", "nginx_*", "postgresql_*"]
  [processors.override.tags]
    collector = "telegraf"

# --- System Inputs ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

# --- Nginx (stub_status) ---
[[inputs.nginx]]
  urls = ["http://nginx:8081/nginx_status"]

# --- PostgreSQL ---
[[inputs.postgresql]]
  address = "host=postgres user=telegraf password=${TELEGRAF_PG_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

# --- Node.js app (Prometheus endpoint) ---
[[inputs.prometheus]]
  urls = ["http://app:3000/metrics"]
  metric_version = 2

# --- Output: re-expose everything for Prometheus ---
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
