services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAF_PG_PASSWORD: ${TELEGRAF_PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  telegraf:
    image: telegraf:1.33
    environment:
      TELEGRAF_PG_PASSWORD: ${TELEGRAF_PG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - nginx
      - postgres
      - app

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - telegraf

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # Traffic generator, runs in a container (no host script needed).
  # Start:  docker compose --profile load up -d loadgen
  # Stop:   docker compose stop loadgen
  loadgen:
    image: curlimages/curl:8.10.1
    profiles: ["load"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          curl -s -o /dev/null http://nginx/
          curl -s -o /dev/null http://nginx/items
          curl -s -o /dev/null -X POST -H "Content-Type: application/json" -d '{"name":"demo"}' http://nginx/items
          curl -s -o /dev/null --max-time 5 http://nginx/slow &
          curl -s -o /dev/null http://nginx/flaky
          sleep 1
        done
    depends_on:
      - nginx

volumes:
  pgdata:
  promdata:
  grafanadata:
